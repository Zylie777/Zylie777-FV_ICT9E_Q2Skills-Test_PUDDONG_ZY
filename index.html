<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

         <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/css/bootstrap.min.css" rel="stylesheet">
         
</head>
<body>
      <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#home">

                <img src="https://tse2.mm.bing.net/th/id/OIP.Go2h-xCZNXs5WcYAnc9S9QHaBw?r=0&pid=Api&h=220&P=0" alt="OBMC-LOGO">


            </a>

            <button class="navbar-toggler" type="button"
            data-bs-toggle="collapse"
            data-bs-target="#mynavbar">

                <span class="navbar-toggler-icon"></span>

            </button>


            <div class="collapse navbar-collapse" id="mynavbar">

                <ul class="navbar-nav me-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="#home">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#about">About Us</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#contact">Contact Us</a>
                    </li>

                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid m-0 p-0">
   <header id="home">

            <img src="https://tse2.mm.bing.net/th/id/OIP.D4tJS_QCkvXqoCjXCcWgzQHaDG?r=0&pid=Api&h=220&P=0"
            alt="OBMC School Campus"
            class="img-fluid w-100 d-block">

        </header>
        
        <br><br>

<section class="form-section">
  <div class="container">
    <header id="contact">

        </header>
    <form>
      
    
      <h4 class="mb-3">Student Information</h4>
      
      
      <div class="row g-3 mb-3">
        <div class="col-md-6">
        
            <label for="firstName" class="form-label">First Name</label>
          <input type="text" class="form-control" id="firstName" placeholder="JOHN">
        </div>
        <div class="col-md-6">
          <label for="lastName" class="form-label">Last Name</label>
          <input type="text" class="form-control" id="lastName" placeholder="DOUGH">
        </div>

         </div>

      <div class="row g-3 mb-4">
        <div class="col-md-4">
          <label for="birthDate" class="form-label">Birth Date</label>
          <input type="date" class="form-control" id="Input your Birthdate here">
        </div>

        <div class="col-md-4">
          <label for="gender" class="form-label">Gender</label>
                <select class="form-select" id="gender">
                    <option selected disabled>Select...</option>
                        <option value="male">Male</option>
                <option value="female">Female</option>
            <option value="Other">Coffee</option>
        <option value="Other">other</option>
        <option value="PNTS">Prefer not to say</option>
            </select>
        </div> 

           <div class="col-md-4">
             <label for="gradeLevel" class="form-label">Grade Level</label>
                 <select class="form-select" id="gradeLevel">
                  <option selected disabled>Select...</option>
                     <option value="7">Grade 7</option>
                     <option value="8">Grade 8</option>
                         <option value="9">Grade 9</option>
                          <option value="10">Grade 10</option>
                 </select>
        </div>

      <h4 class="mb-3">Contact Details</h4>
      
      <div class="mb-3">
        <label for="email" class="form-label">Email Address</label>
        <input type="email" class="form-control" id="email" placeholder="gamdamstyle@example.com">
      </div>
      
      <div class="mb-4">
        <label for="contactNumber" class="form-label">Contact Number</label>
        <input type="tel" class="form-control" id="contactNumber" placeholder="7777-7777-7777">
      </div>

 <h4 class="mb-3">Other Information</h4>
      
      <div class="mb-3">
        <label class="form-label d-block">Mode of Learning</label>
        <div class="form-check">
          <input class="form-check-input" type="radio" name="learningMode" id="online" value="online">
          <label class="form-check-label" for="online">Online</label>
        </div>

        <div class="form-check">
          <input class="form-check-input" type="radio" name="learningMode" id="f2f" value="f2f">
          <label class="form-check-label" for="f2f">Face-to-Face</label>
        </div>

        <div class="form-check">
          <input class="form-check-input" type="radio" name="HYBRID" id="HYBRID" value="HYBRID">
          <label class="form-check-label" for="f2f">Hybrid</label>
        </div>
     
      <div class="form-check mb-4">
        <input class="form-check-input" type="checkbox" id="confirmCheck">
        <label class="form-check-label" for="confirmCheck">
          I confirm that this information I provided is fact and complete.
        </label>
    </div>

    <div class="text-center">
        <button type="submit" class="btn btn-primary px-4 py-2">Submit Enrollment</button>
      </div>

</div>



</body>
</html>
